# Releases one pre-written entry from upcoming/ each day. See .github/scripts/publish.py.
name: publish
on:
  schedule:
    - cron: "23 13 * * *"
    - cron: "23 16 * * *"
    - cron: "23 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Commit timestamps in New York time so each day's work lands on the right square.
env:
  TZ: America/New_York

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pytest
      - run: python .github/scripts/publish.py
      - run: git push
